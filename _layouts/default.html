<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {% feed_meta %}

  <!-- Visualization Libraries Support -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
      <div class="header-container">
        <div class="site-title">
          <a href="{{ "/" | relative_url }}">⚡ {{ site.title | default: "Product Wiki & Engineering Hub" }}</a>
        </div>
        <nav class="site-nav">
          <a class="nav-link {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}" href="{{ "/" | relative_url }}">Home</a>
          <a class="nav-link {% if page.url contains '/docs/' %}active{% endif %}" href="{{ "/docs/" | relative_url }}">Docs</a>
          <a class="nav-link {% if page.url contains '/blog/' %}active{% endif %}" href="{{ "/blog/" | relative_url }}">Blog</a>
          <a class="nav-link {% if page.url contains 'Showcase' or page.url contains 'Example' %}active{% endif %}" href="{{ "/Rendering Showcase/" | relative_url }}">Showcase</a>

          <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
            <span id="theme-icon">🌙</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <div>
          <strong>{{ site.title }}</strong> &copy; {{ 'now' | date: "%Y" }} — Personal Knowledge & Engineering Portal
        </div>
        <div>
          Powered by Jekyll & GitHub Pages
        </div>
      </div>
    </footer>
  </div>

  <!-- Theme Switcher Script -->
  <script>
    (function() {
      const toggleBtn = document.getElementById('theme-toggle');
      const themeIcon = document.getElementById('theme-icon');
      const storedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      document.documentElement.setAttribute('data-theme', storedTheme);
      themeIcon.textContent = storedTheme === 'dark' ? '☀️' : '🌙';

      toggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });
    })();
  </script>

  <!-- Script Initializers for Visualisations -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 1. Initialize Mermaid Diagrams
      if (typeof mermaid !== "undefined") {
        mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
      }

      // 2. Initialize KaTeX Math Formulas
      if (typeof renderMathInElement !== "undefined") {
        renderMathInElement(document.body, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ]
        });
      }

      // 3. Transform Obsidian/Note Callouts (> [!Note], > [!Summary], etc.)
      document.querySelectorAll('blockquote').forEach(function(bq) {
        const html = bq.innerHTML.trim();
        const calloutMatch = html.match(/^<p>\[\!(Note|Summary|Warning|Important|Tip)\]\s*(.*?)<\/p>/i);
        if (calloutMatch) {
          const type = calloutMatch[1].toLowerCase();
          const title = calloutMatch[2] || type.toUpperCase();
          const content = html.replace(/^<p>\[\!(Note|Summary|Warning|Important|Tip)\]\s*.*?<\/p>/i, '');

          const div = document.createElement('div');
          div.className = 'callout callout-' + type;
          div.innerHTML = '<div class="callout-title">💡 ' + title + '</div>' + content;
          bq.parentNode.replaceChild(div, bq);
        }
      });
    });
  </script>
</body>
</html>
